<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Meridian Run — Key HUD (play screen)</title>
        <style>
            /* ============================================================================
   MERIDIAN RUN — KEY HUD  ·  1:1 play-screen mock
   ----------------------------------------------------------------------------
   Decision-log IDs illustrated by this file:
     H5  — HUD layout        (all HUD in the top band, never over the lane)
     H4  — info hierarchy    (timer > ship-HP > score; lives discrete; wave #
                              readout top-right beneath score; tier dropped)
     T1  — wave timer        (prominent seconds read-out, survive-to-end)
     C1  — docked display    (dual-fighter docked to ONE side of ship, ~80% scale;
                              allied hero-neon accent — provisional, see --dock)
     C2  — glow              (consistent neon glow sells the vector look)
     C3  — tractor column    (boundary lines + hazard fill, fair-dodge telegraph)
     S1  — focus/fade        (climax: timer + HP bar + LIVES stay sharp;
                              score + wave/modifier chrome dim)
     H6  — HP pips           (one segmented-bar HP idiom for PLAYER + multi-hit
                              enemies; Grunts show none. Ring/halo RESERVED for
                              a future Shield power-up — not used for HP.)
   ----------------------------------------------------------------------------
   PALETTE IS LIVE-SWITCHABLE for evaluation. The 15 canonical tokens from the
   companion color-themes sheet are declared on :root below in Vector Standard
   defaults; the floating PALETTE · eval bar swaps them at runtime.
   TOKEN MAPPING (supplied verbatim by all 5 themes):
     surface · surface-alt · text · muted · border · primary · primary-hover ·
     health · hazard · score · currency · modifier-swarm · modifier-gauntlet ·
     modifier-bounty · glow
   DERIVED ONCE in CSS (source palette defines no value; aliased / color-mix'd
   so every theme — and the Arc interpolation — tracks them automatically):
     --shield     ← var(--currency)   grunt + mag-bullet accent. NOTE: --currency
                                      is no longer DISPLAYED in the in-wave HUD
                                      (wave score converts to currency at the shop
                                      screen); the token stays in the palette so
                                      grunts/mag-bullets still track it.
     --dock       ← var(--primary-hover)  PROVISIONAL docked-fighter accent. With
                                      currency off the in-wave HUD, the docked
                                      wingman now adopts the hero-neon family
                                      (brighter variant of --primary) so it reads
                                      allied, not aggressor. Warm palettes (Cinder)
                                      may need a dedicated non-aggressor dock token
                                      — revisit at the Shield power-up pass.
     --bg-0/1/2   ← surface / surface-alt
     --grid       ← primary @ 6% alpha
     --cyan-dim   ← primary mixed toward surface
     --ink-faint  ← muted mixed toward surface
     --mag/--hp/--amber/--cyan/--ink/--ink-dim/--hair ← direct aliases
   ========================================================================== */

            :root {
                /* ---- Vector Standard defaults (also the load-time theme) ---- */
                --surface: #060912;
                --surface-alt: #0c1424;
                --text: #e6f1ff;
                --muted: #7e8daa;
                --border: #1e2a44;
                --primary: #00e5ff;
                --primary-hover: #5af7ff;
                --health: #4ade80;
                --hazard: #ff3d5a;
                --score: #ffe066;
                --currency: #c084fc;
                --modifier-swarm: #ff3d5a;
                --modifier-gauntlet: #00e5ff;
                --modifier-bounty: #ffe066;
                --glow: #5af7ff;

                /* ---- climax termini (Polybius Dusk) — used by the focus/climax state ---- */
                --climax-hazard: #ff9e3d; /* amber — hue+luminance-distinct from climax magenta */
                --climax-muted: #9979b0; /* lifted to clear WCAG-AA on climax-surface */

                /* ---- derived (see note above) ---- */
                --shield: var(--currency);
                --dock: var(--primary-hover);
                --bg-0: var(--surface);
                --bg-1: var(--surface-alt);
                --bg-2: var(--surface-alt);
                --grid: color-mix(in srgb, var(--primary) 6%, transparent);
                --cyan: var(--primary);
                --cyan-dim: color-mix(
                    in srgb,
                    var(--primary) 50%,
                    var(--surface)
                );
                --mag: var(--shield);
                --hp: var(--health);
                --amber: var(--modifier-gauntlet);
                --ink: var(--text);
                --ink-dim: var(--muted);
                --ink-faint: color-mix(
                    in srgb,
                    var(--muted) 50%,
                    var(--surface)
                );
                --hair: var(--border);

                --mono:
                    ui-monospace, "Cascadia Code", "JetBrains Mono", "SF Mono",
                    Menlo, Consolas, "Liberation Mono", monospace;
                --sans:
                    system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu,
                    sans-serif;
            }

            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                background: var(--surface);
                color: var(--ink);
                font-family: var(--sans);
            }
            body {
                min-height: 100vh;
                background: radial-gradient(
                        1200px 700px at 50% -10%,
                        color-mix(in srgb, var(--primary) 14%, var(--surface))
                            0%,
                        var(--surface) 62%
                    )
                    fixed;
                padding: 96px 32px 56px;
                -webkit-font-smoothing: antialiased;
            }

            /* ============================================================================
   PALETTE · eval  —  floating dev control (NOT part of the game frame)
   Dashed border + DEV tag so it reads as tooling. Reskins with the theme so
   the evaluator sees each palette's own neon on the control itself.
   ========================================================================== */
            .palette-bar {
                position: fixed;
                top: 10px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 1000;
                display: flex;
                flex-direction: column;
                gap: 8px;
                align-items: center;
                background: color-mix(in srgb, var(--surface) 88%, transparent);
                -webkit-backdrop-filter: blur(10px);
                backdrop-filter: blur(10px);
                border: 1px dashed
                    color-mix(in srgb, var(--primary) 55%, transparent);
                border-radius: 10px;
                padding: 8px 12px;
                box-shadow:
                    0 10px 34px -12px rgba(0, 0, 0, 0.75),
                    0 0 20px -8px
                        color-mix(in srgb, var(--primary) 50%, transparent);
                font-family: var(--mono);
                max-width: calc(100vw - 24px);
            }
            .pb-top {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .pb-label {
                font-size: 10.5px;
                letter-spacing: 0.22em;
                color: var(--primary);
                font-weight: 700;
                text-shadow: 0 0 8px
                    color-mix(in srgb, var(--primary) 60%, transparent);
            }
            .pb-tag {
                font-size: 8.5px;
                letter-spacing: 0.16em;
                color: var(--muted);
                border: 1px solid var(--border);
                padding: 2px 5px;
                border-radius: 3px;
                background: color-mix(
                    in srgb,
                    var(--surface-alt) 70%,
                    transparent
                );
            }
            .pb-themes {
                display: flex;
                gap: 5px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .pb-themes button {
                font-family: var(--mono);
                font-size: 10.5px;
                letter-spacing: 0.04em;
                color: var(--muted);
                background: transparent;
                border: 1px solid var(--border);
                padding: 5px 9px;
                border-radius: 5px;
                cursor: pointer;
                font-weight: 600;
                transition:
                    color 0.14s,
                    border-color 0.14s,
                    background 0.14s,
                    box-shadow 0.14s;
            }
            .pb-themes button:hover {
                color: var(--text);
                border-color: color-mix(
                    in srgb,
                    var(--primary) 50%,
                    var(--border)
                );
            }
            .pb-themes button.active {
                color: var(--primary);
                border-color: color-mix(
                    in srgb,
                    var(--primary) 65%,
                    transparent
                );
                background: color-mix(in srgb, var(--primary) 12%, transparent);
                box-shadow: 0 0 12px -3px
                    color-mix(in srgb, var(--primary) 55%, transparent);
            }
            .pb-themes button.pb-arc {
                border-style: dotted;
                color: var(--shield);
            }
            .pb-themes button.pb-arc.active {
                color: var(--shield);
                border-color: color-mix(
                    in srgb,
                    var(--shield) 65%,
                    transparent
                );
                background: color-mix(in srgb, var(--shield) 14%, transparent);
                box-shadow: 0 0 12px -3px
                    color-mix(in srgb, var(--shield) 55%, transparent);
            }
            .pb-arc-row {
                display: flex;
                align-items: center;
                gap: 9px;
                font-family: var(--mono);
                font-size: 10px;
                color: var(--muted);
                padding-top: 2px;
            }
            .pb-arc-row[hidden] {
                display: none;
            }
            .pb-arc-label {
                letter-spacing: 0.14em;
            }
            .pb-slider {
                -webkit-appearance: none;
                appearance: none;
                width: 240px;
                height: 4px;
                border-radius: 2px;
                background: linear-gradient(
                    90deg,
                    var(--primary),
                    var(--shield)
                );
                outline: none;
                cursor: pointer;
            }
            .pb-slider::-webkit-slider-thumb {
                -webkit-appearance: none;
                appearance: none;
                width: 15px;
                height: 15px;
                border-radius: 50%;
                background: var(--text);
                border: 2px solid var(--primary);
                box-shadow: 0 0 10px
                    color-mix(in srgb, var(--primary) 75%, transparent);
                cursor: pointer;
            }
            .pb-slider::-moz-range-thumb {
                width: 15px;
                height: 15px;
                border-radius: 50%;
                background: var(--text);
                border: 2px solid var(--primary);
                box-shadow: 0 0 10px
                    color-mix(in srgb, var(--primary) 75%, transparent);
                cursor: pointer;
            }
            .pb-arc-val {
                color: var(--text);
                font-weight: 700;
                min-width: 36px;
                text-align: right;
            }

            /* ---------- page masthead ---------- */
            .masthead {
                max-width: 1580px;
                margin: 0 auto 22px;
                display: flex;
                align-items: baseline;
                gap: 18px;
                flex-wrap: wrap;
            }
            .masthead h1 {
                font-size: 15px;
                letter-spacing: 0.22em;
                text-transform: uppercase;
                margin: 0;
                color: var(--ink);
                font-weight: 600;
            }
            .masthead .sub {
                font-size: 12.5px;
                color: var(--ink-dim);
                letter-spacing: 0.04em;
            }
            .masthead .tag {
                margin-left: auto;
                font: 600 11px/1 var(--mono);
                letter-spacing: 0.14em;
                color: var(--cyan);
                border: 1px solid
                    color-mix(in srgb, var(--primary) 40%, transparent);
                padding: 5px 9px;
                border-radius: 3px;
                box-shadow:
                    0 0 10px color-mix(in srgb, var(--primary) 25%, transparent),
                    inset 0 0 8px
                        color-mix(in srgb, var(--primary) 8%, transparent);
            }

            /* ---------- two windows side by side ---------- */
            .windows {
                max-width: 1580px;
                margin: 0 auto;
                display: flex;
                flex-direction: row;
                gap: 34px;
                align-items: flex-start;
                justify-content: center;
                flex-wrap: wrap;
            }
            .window {
                margin: 0;
                background: linear-gradient(
                    180deg,
                    var(--surface-alt),
                    var(--surface)
                );
                border: 1px solid var(--border);
                border-radius: 10px;
                overflow: hidden;
                box-shadow:
                    0 30px 70px -30px rgba(0, 0, 0, 0.9),
                    0 0 0 1px rgba(0, 0, 0, 0.5);
            }

            /* desktop window titlebar (Windows/Linux flavor) */
            .titlebar {
                display: flex;
                align-items: center;
                gap: 10px;
                height: 30px;
                padding: 0 10px;
                background: linear-gradient(
                    180deg,
                    var(--surface-alt),
                    var(--surface)
                );
                border-bottom: 1px solid var(--border);
            }
            .titlebar .glyph {
                width: 14px;
                height: 14px;
                border-radius: 3px;
                display: grid;
                place-items: center;
                background: radial-gradient(
                    circle at 50% 40%,
                    var(--cyan),
                    var(--cyan-dim)
                );
                box-shadow: 0 0 8px
                    color-mix(in srgb, var(--primary) 60%, transparent);
            }
            .titlebar .glyph::after {
                content: "";
                width: 0;
                height: 0;
                border-left: 4px solid transparent;
                border-right: 4px solid transparent;
                border-bottom: 7px solid var(--surface);
            }
            .titlebar .title {
                font-size: 12px;
                color: var(--ink-dim);
                letter-spacing: 0.03em;
            }
            .titlebar .title b {
                color: var(--ink);
                font-weight: 600;
            }
            .titlebar .spacer {
                flex: 1;
            }
            .titlebar .ctl {
                display: flex;
                gap: 14px;
                color: var(--ink-faint);
                font-size: 12px;
                letter-spacing: 0.04em;
            }
            .titlebar .ctl span {
                cursor: default;
            }
            .titlebar .ctl .x {
                color: var(--ink-dim);
            }

            /* ---------- 16:9 viewport ---------- */
            .viewport {
                position: relative;
                width: 760px;
                aspect-ratio: 16/9;
                overflow: hidden;
                background: var(--bg-0);
                font-family: var(--sans);
            }

            /* background layers (z:0) */
            .bg-grid,
            .bg-stars,
            .bg-vign {
                position: absolute;
                inset: 0;
                pointer-events: none;
            }
            .bg-grid {
                background-image:
                    linear-gradient(var(--grid) 1px, transparent 1px),
                    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
                background-size: 38px 38px;
                mask-image: radial-gradient(
                    120% 90% at 50% 35%,
                    #000 55%,
                    transparent 100%
                );
            }
            .bg-stars {
                background-image:
                    radial-gradient(
                        1px 1px at 12% 18%,
                        color-mix(in srgb, var(--text) 70%, transparent),
                        transparent 60%
                    ),
                    radial-gradient(
                        1px 1px at 78% 12%,
                        color-mix(in srgb, var(--text) 55%, transparent),
                        transparent 60%
                    ),
                    radial-gradient(
                        1px 1px at 32% 30%,
                        color-mix(in srgb, var(--text) 40%, transparent),
                        transparent 60%
                    ),
                    radial-gradient(
                        1px 1px at 64% 24%,
                        color-mix(in srgb, var(--text) 60%, transparent),
                        transparent 60%
                    ),
                    radial-gradient(
                        1.4px 1.4px at 88% 40%,
                        color-mix(in srgb, var(--score) 55%, transparent),
                        transparent 60%
                    ),
                    radial-gradient(
                        1px 1px at 46% 14%,
                        color-mix(in srgb, var(--text) 50%, transparent),
                        transparent 60%
                    ),
                    radial-gradient(
                        1px 1px at 8% 44%,
                        color-mix(in srgb, var(--text) 40%, transparent),
                        transparent 60%
                    );
            }
            .bg-vign {
                box-shadow: inset 0 0 160px 30px
                    color-mix(in srgb, #000 60%, var(--surface));
            }

            /* ============================================================================
   TOP BAND — all HUD lives here (H5)
   ========================================================================== */
            .topband {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                z-index: 30;
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                padding: 11px 16px 12px;
                height: 58px;
                background: linear-gradient(
                    180deg,
                    color-mix(in srgb, var(--surface) 92%, transparent) 0%,
                    color-mix(in srgb, var(--surface) 55%, transparent) 70%,
                    transparent 100%
                );
            }
            .topband::after {
                content: "";
                position: absolute;
                left: 16px;
                right: 16px;
                bottom: 3px;
                height: 1px;
                background: linear-gradient(
                    90deg,
                    transparent,
                    var(--hair) 18%,
                    var(--hair) 82%,
                    transparent
                );
            }

            .zone {
                display: flex;
                flex-direction: column;
                gap: 3px;
            }
            .zone.center {
                align-items: center;
            }
            .zone.right {
                align-items: flex-end;
            }

            /* — ship name + lives (top-left) — */
            .ship-name {
                font-size: 9.5px;
                letter-spacing: 0.34em;
                color: var(--cyan);
                font-weight: 700;
                text-shadow: 0 0 8px
                    color-mix(in srgb, var(--primary) 55%, transparent);
            }
            .lives {
                display: flex;
                align-items: center;
                gap: 5px;
                margin-top: 1px;
            }
            .lives .life {
                width: 17px;
                height: 17px;
                display: block;
            }
            .lives .life.on path {
                fill: color-mix(in srgb, var(--primary) 16%, transparent);
                stroke: var(--cyan);
                filter: drop-shadow(
                    0 0 5px color-mix(in srgb, var(--primary) 90%, transparent)
                );
            }
            .lives .life.off path {
                fill: transparent;
                stroke: var(--ink-faint);
                stroke-dasharray: 2 2;
                opacity: 0.55;
            }
            .lives .x {
                margin-left: 4px;
                font: 600 10px/1 var(--mono);
                color: var(--ink-dim);
            }

            /* — wave timer (top-center) — (T1) */
            .timer {
                display: flex;
                align-items: baseline;
                gap: 1px;
                font-family: var(--mono);
                font-weight: 700;
                color: var(--text);
                line-height: 1;
            }
            .timer .t-num {
                font-size: 30px;
                letter-spacing: 0.01em;
                text-shadow:
                    0 0 8px color-mix(in srgb, var(--primary) 85%, transparent),
                    0 0 22px color-mix(in srgb, var(--primary) 55%, transparent);
            }
            .timer .t-suf {
                font-size: 15px;
                color: var(--cyan);
                text-shadow: 0 0 8px
                    color-mix(in srgb, var(--primary) 70%, transparent);
            }
            .timer-label {
                font-size: 8.5px;
                letter-spacing: 0.4em;
                color: var(--ink-dim);
                margin-top: 1px;
                font-weight: 600;
            }

            /* — score + wave/modifier readout (top-right) — (H4: score only; wave # beneath) */
            .score .label {
                font-size: 8px;
                letter-spacing: 0.3em;
                color: var(--ink-dim);
                font-weight: 600;
            }
            .score .val {
                font-family: var(--mono);
                font-weight: 700;
                font-size: 18px;
                color: var(--score);
                letter-spacing: 0.02em;
                text-shadow:
                    0 0 8px color-mix(in srgb, var(--score) 60%, transparent),
                    0 0 18px color-mix(in srgb, var(--score) 35%, transparent);
            }
            .wave-row {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-top: 4px;
            }
            .wave-num {
                font: 700 9.5px/1 var(--mono);
                letter-spacing: 0.22em;
                color: var(--ink-dim);
            }
            .wave-num b {
                color: var(--text);
                font-weight: 700;
            }
            /* modifier chip — relocated from the center banner to top-right; kept small.
   Same shape-glyph idiom (⬢ GAUNTLET / ▲ SWARM / ◆ BOUNTY) so it stays
   colorblind-safe across every palette AND the Arc interpolation. */
            .mod-chip {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                font: 700 8.5px/1 var(--sans);
                letter-spacing: 0.16em;
                color: var(--amber);
                padding: 3px 6px;
                border-radius: 3px;
                border: 1px solid
                    color-mix(
                        in srgb,
                        var(--modifier-gauntlet) 55%,
                        transparent
                    );
                background: color-mix(
                    in srgb,
                    var(--modifier-gauntlet) 6%,
                    transparent
                );
                box-shadow:
                    0 0 10px
                        color-mix(
                            in srgb,
                            var(--modifier-gauntlet) 22%,
                            transparent
                        ),
                    inset 0 0 8px
                        color-mix(
                            in srgb,
                            var(--modifier-gauntlet) 8%,
                            transparent
                        );
            }
            .mod-chip .g {
                font-size: 10px;
                line-height: 1;
                color: var(--amber);
                text-shadow: 0 0 6px
                    color-mix(
                        in srgb,
                        var(--modifier-gauntlet) 80%,
                        transparent
                    );
            }

            /* ============================================================================
   TRACTOR / CAPTURE COLUMN (C3) — fair-dodge telegraph, locks to player X
   ========================================================================== */
            .tractor {
                position: absolute;
                left: 50%;
                top: 0;
                bottom: 54px;
                width: 96px;
                transform: translateX(-50%);
                z-index: 8;
                pointer-events: none;
            }
            .tractor-fill {
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    180deg,
                    color-mix(in srgb, var(--hazard) 5%, transparent),
                    color-mix(in srgb, var(--hazard) 22%, transparent) 30%,
                    color-mix(in srgb, var(--hazard) 22%, transparent) 70%,
                    color-mix(in srgb, var(--hazard) 6%, transparent)
                );
                border-radius: 2px;
            }
            .tractor-edge {
                position: absolute;
                top: 0;
                bottom: 0;
                width: 2px;
                background: var(--hazard);
                box-shadow:
                    0 0 8px color-mix(in srgb, var(--hazard) 90%, transparent),
                    0 0 20px color-mix(in srgb, var(--hazard) 55%, transparent);
            }
            .tractor-edge.l {
                left: -1px;
            }
            .tractor-edge.r {
                right: -1px;
            }
            .tractor .sweep {
                position: absolute;
                left: 6px;
                right: 6px;
                top: 0;
                height: 14px;
                background: linear-gradient(
                    180deg,
                    color-mix(in srgb, var(--hazard) 62%, transparent),
                    transparent
                );
                animation: sweep 1.1s linear infinite;
                filter: blur(0.5px);
            }
            @keyframes sweep {
                from {
                    transform: translateY(-20px);
                }
                to {
                    transform: translateY(360px);
                }
            }

            /* ============================================================================
   ENEMY FIRE-COLUMNS (read the columns to track enemies)
   ========================================================================== */
            .firecol {
                position: absolute;
                top: 0;
                bottom: 0;
                width: 10px;
                z-index: 10;
                pointer-events: none;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 14px;
                padding-top: 6px;
            }
            .bullet {
                width: 5px;
                height: 9px;
                border-radius: 50%;
                background: var(--hazard);
                box-shadow:
                    0 0 6px color-mix(in srgb, var(--hazard) 90%, transparent),
                    0 0 12px color-mix(in srgb, var(--hazard) 55%, transparent);
            }
            .bullet.mag {
                background: var(--mag);
                box-shadow:
                    0 0 6px color-mix(in srgb, var(--shield) 90%, transparent),
                    0 0 12px color-mix(in srgb, var(--shield) 50%, transparent);
            }
            .bullet.amber {
                background: var(--amber);
                box-shadow:
                    0 0 6px
                        color-mix(
                            in srgb,
                            var(--modifier-gauntlet) 85%,
                            transparent
                        ),
                    0 0 12px
                        color-mix(
                            in srgb,
                            var(--modifier-gauntlet) 45%,
                            transparent
                        );
            }

            /* ============================================================================
   ENEMIES  (H6: selective HP — Shielder pip, Grunts have none)
   ========================================================================== */
            .enemy {
                position: absolute;
                z-index: 14;
                transform: translateX(-50%);
            }
            .enemy svg {
                display: block;
                overflow: visible;
            }
            .enemy-grunt svg {
                width: 20px;
                height: 20px;
                filter: drop-shadow(
                    0 0 5px color-mix(in srgb, var(--shield) 75%, transparent)
                );
            }
            .enemy-grunt svg path {
                fill: color-mix(in srgb, var(--shield) 16%, transparent);
                stroke: var(--shield);
                stroke-width: 1.4;
            }
            .enemy-shielder svg {
                width: 40px;
                height: 40px;
                filter: drop-shadow(
                    0 0 7px
                        color-mix(
                            in srgb,
                            var(--modifier-gauntlet) 80%,
                            transparent
                        )
                );
            }
            .enemy-shielder svg > path {
                fill: color-mix(
                    in srgb,
                    var(--modifier-gauntlet) 14%,
                    transparent
                );
                stroke: var(--modifier-gauntlet);
                stroke-width: 1.6;
            }
            .enemy-shielder svg > path + path {
                fill: none;
                stroke: color-mix(
                    in srgb,
                    var(--modifier-gauntlet) 55%,
                    transparent
                );
                stroke-width: 1.2;
            }
            .enemy-shielder svg > circle {
                fill: color-mix(in srgb, var(--modifier-gauntlet) 55%, white);
            }
            .hp-pip {
                position: absolute;
                left: 50%;
                bottom: -9px;
                transform: translateX(-50%);
                display: flex;
                gap: 2px;
            }
            .hp-pip i {
                display: block;
                width: 8px;
                height: 3px;
                border-radius: 1px;
                background: var(--hp);
                box-shadow: 0 0 5px
                    color-mix(in srgb, var(--health) 80%, transparent);
            }
            .hp-pip i.empty {
                background: transparent;
                border: 1px solid var(--ink-faint);
                box-shadow: none;
            }

            /* ============================================================================
   WAVE-START BANNER — REMOVED
   ----------------------------------------------------------------------------
   The center banner overlapped enemy ships and hurt readability. The wave
   number now lives as a small persistent readout top-right, beneath the SCORE;
   the modifier chip sits beside it. Tier indicator dropped entirely (player
   chose their tier pre-run, so it carries no in-wave information).
   ========================================================================== */

            /* ============================================================================
   BOTTOM LANE + PLAYER SHIP (C1 docked fighter, C2 glow, segmented HP bar)
   ========================================================================== */
            .lane {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                height: 54px;
                z-index: 20;
            }
            .lane-track {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 20px;
                height: 2px;
                background: linear-gradient(
                    90deg,
                    transparent,
                    color-mix(in srgb, var(--primary) 25%, transparent) 12%,
                    color-mix(in srgb, var(--primary) 55%, transparent) 50%,
                    color-mix(in srgb, var(--primary) 25%, transparent) 88%,
                    transparent
                );
                box-shadow: 0 0 8px
                    color-mix(in srgb, var(--primary) 40%, transparent);
            }
            /* tiny ID label so the bar is not mysterious: this is the player's horizontal
   movement LANE (1-axis chassis), not a progress / build / timer meter. */
            .lane-track::before {
                content: "LANE";
                position: absolute;
                left: 10px;
                top: -14px;
                font: 600 7px/1 var(--mono);
                letter-spacing: 0.32em;
                color: var(--ink-faint);
                pointer-events: none;
            }
            .lane-track::after {
                content: "";
                position: absolute;
                left: 50%;
                bottom: -3px;
                width: 120px;
                height: 6px;
                transform: translateX(-50%);
                background: radial-gradient(
                    ellipse,
                    color-mix(in srgb, var(--primary) 50%, transparent),
                    transparent 70%
                );
            }

            .player {
                position: absolute;
                left: 50%;
                bottom: 14px;
                transform: translateX(-50%);
                z-index: 22;
            }
            /* Player HP — segmented bar ABOVE the ship, SAME idiom as the enemy hp-pip
   (H6): one consistent HP language for player + enemies. The ring/halo visual
   is RESERVED for a future Shield power-up and is no longer used for HP. */
            .player .hp-bar {
                position: absolute;
                left: 50%;
                top: -10px;
                transform: translateX(-50%);
                display: flex;
                gap: 3px;
                z-index: 3;
                pointer-events: none;
            }
            .player .hp-bar i {
                display: block;
                width: 10px;
                height: 4px;
                border-radius: 1px;
                background: var(--hp);
                box-shadow: 0 0 5px
                    color-mix(in srgb, var(--health) 80%, transparent);
            }
            .player .hp-bar i.empty {
                background: transparent;
                border: 1px solid var(--ink-faint);
                box-shadow: none;
            }

            .player .ship {
                position: relative;
                display: block;
                width: 34px;
                height: 34px;
                z-index: 2;
            }
            .player .ship path {
                fill: color-mix(in srgb, var(--primary) 14%, transparent);
                stroke: var(--cyan);
                stroke-width: 1.6;
                filter: drop-shadow(
                        0 0 6px
                            color-mix(in srgb, var(--primary) 95%, transparent)
                    )
                    drop-shadow(
                        0 0 14px
                            color-mix(in srgb, var(--primary) 60%, transparent)
                    );
            }
            .player .ship .core {
                fill: var(--text);
                filter: drop-shadow(
                    0 0 5px color-mix(in srgb, var(--text) 100%, transparent)
                );
            }

            /* docked dual-fighter (C1): offset to the RIGHT of the main ship at ~80% scale
   (27/34), with slight overlap so the pair reads as one unit. Allied hero-neon
   accent via --dock (provisional — see token note). The ring around it is the
   docked fighter's first-hit shield — ring visual reserved for Shield semantics,
   consistent with H6. */
            .docked {
                position: absolute;
                left: calc(100% + 4px);
                top: 50%;
                width: 27px;
                height: 27px;
                transform: translate(-50%, -50%);
                z-index: 1;
            }
            .docked .ship-sm path {
                fill: color-mix(in srgb, var(--dock) 14%, transparent);
                stroke: var(--dock);
                stroke-width: 1.4;
                filter: drop-shadow(
                        0 0 6px color-mix(in srgb, var(--dock) 95%, transparent)
                    )
                    drop-shadow(
                        0 0 12px
                            color-mix(in srgb, var(--dock) 55%, transparent)
                    );
            }
            .docked .shield {
                position: absolute;
                inset: -4px;
                border-radius: 50%;
                border: 1px solid
                    color-mix(in srgb, var(--dock) 55%, transparent);
                box-shadow:
                    0 0 8px color-mix(in srgb, var(--dock) 45%, transparent),
                    inset 0 0 6px
                        color-mix(in srgb, var(--dock) 25%, transparent);
                pointer-events: none;
            }

            /* engine glow under ship */
            .player::after {
                content: "";
                position: absolute;
                left: 50%;
                top: -2px;
                transform: translateX(-50%);
                width: 10px;
                height: 18px;
                background: radial-gradient(
                    ellipse at 50% 0%,
                    color-mix(in srgb, var(--primary) 55%, transparent),
                    transparent 70%
                );
                filter: blur(1px);
            }

            /* ============================================================================
   FOCUS / FADE STATE (S1) — Rosa wave-20 climax
   score + non-essential chrome dim; timer + on-ship HP stay sharp; denser fire
   ========================================================================== */
            /* S1 — climax focus/fade. Only SCORE + wave/modifier chrome dim. The timer,
   the on-ship HP bar, the lives/ship-name (left zone) ALL stay sharp — lives
   used to dim via .zone.left; they are now explicitly exempt. */
            .viewport.focus .score,
            .viewport.focus .wave-row {
                opacity: 0.32;
                filter: saturate(0.5);
            }
            .viewport.focus .timer .t-num,
            .viewport.focus .timer .t-suf {
                /* A2: low-time/focus timer halo goes NEUTRAL WHITE, not
                   --primary (which is magenta at climax and would bleed
                   red-on-magenta over the hazard numeric). The numeric itself
                   sits on the translucent topband scrim — crisp over busy peak. */
                text-shadow:
                    0 0 10px color-mix(in srgb, var(--text) 100%, transparent),
                    0 0 28px color-mix(in srgb, var(--text) 70%, transparent),
                    0 0 48px color-mix(in srgb, var(--text) 40%, transparent);
            }
            .viewport.focus .player .ship path {
                /* A2 color-safety core: at the climax the player ship keeps a
                   BRIGHT OUTLINE (crisper stroke + bright text-core halo) so the
                   arrowhead silhouette stays distinct from the amber pellets of
                   enemy fire and the amber parallel bars of the tractor — even
                   with hero magenta and hazard amber both on screen. */
                stroke-width: 2.4;
                filter: drop-shadow(
                        0 0 2px color-mix(in srgb, var(--text) 100%, transparent)
                    )
                    drop-shadow(
                        0 0 7px
                            color-mix(in srgb, var(--text) 100%, transparent)
                    )
                    drop-shadow(
                        0 0 16px
                            color-mix(in srgb, var(--primary) 85%, transparent)
                    );
            }
            /* A2: enemy fire + tractor render in --climax-hazard amber at the
               climax (hue+luminance-distinct from climax magenta). Shape stays a
               small PELLET (no bright outline) — visually lighter + unoutlined
               next to the player family's bright-outlined arrowhead/chevron. */
            .viewport.focus .bullet,
            .viewport.focus .bullet.mag {
                width: 5px;
                height: 9px;
                border-radius: 50%;
                background: var(--climax-hazard);
                box-shadow:
                    0 0 6px color-mix(in srgb, var(--climax-hazard) 90%, transparent),
                    0 0 12px color-mix(in srgb, var(--climax-hazard) 55%, transparent);
            }
            .viewport.focus .tractor-edge {
                background: var(--climax-hazard);
                box-shadow:
                    0 0 8px color-mix(in srgb, var(--climax-hazard) 90%, transparent),
                    0 0 20px color-mix(in srgb, var(--climax-hazard) 55%, transparent);
            }
            .viewport.focus .tractor-fill {
                background: linear-gradient(
                    180deg,
                    color-mix(in srgb, var(--climax-hazard) 5%, transparent),
                    color-mix(in srgb, var(--climax-hazard) 22%, transparent) 30%,
                    color-mix(in srgb, var(--climax-hazard) 22%, transparent) 70%,
                    color-mix(in srgb, var(--climax-hazard) 6%, transparent)
                );
            }
            .viewport.focus .tractor .sweep {
                background: linear-gradient(
                    180deg,
                    color-mix(in srgb, var(--climax-hazard) 62%, transparent),
                    transparent
                );
            }
            /* A2: player projectiles — elongated chevrons with a bright outline,
               shape+outline-distinct from the enemy pellet. Player family. */
            .viewport.focus .player .ship {
                overflow: visible;
            }
            .viewport.focus .player .ship .pshot {
                fill: color-mix(in srgb, var(--text) 60%, transparent);
                stroke: var(--text);
                stroke-width: 1.2;
                filter: drop-shadow(
                    0 0 4px color-mix(in srgb, var(--text) 100%, transparent)
                );
            }
            /* denser threat */
            .viewport.focus .firecol {
                gap: 9px;
            }
            .viewport.focus .bg-vign {
                box-shadow: inset 0 0 200px 50px
                    color-mix(in srgb, var(--hazard) 25%, #000 70%);
            }
            .viewport.focus .climax {
                opacity: 0.85;
            }
            .climax {
                position: absolute;
                left: 50%;
                top: 74px;
                transform: translateX(-50%);
                z-index: 16;
                opacity: 0;
                font: 700 10.5px/1 var(--mono);
                letter-spacing: 0.34em;
                color: var(--hazard);
                text-shadow: 0 0 10px
                    color-mix(in srgb, var(--hazard) 80%, transparent);
            }
            .climax b {
                color: color-mix(in srgb, var(--text) 70%, var(--hazard));
            }

            /* ---------- captions under each window ---------- */
            figcaption {
                max-width: 760px;
                padding: 11px 14px 13px;
                font-size: 12px;
                color: var(--ink-dim);
                border-top: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                gap: 3px;
                background: var(--surface);
            }
            figcaption b {
                color: var(--ink);
                font-weight: 600;
                letter-spacing: 0.02em;
            }
            figcaption .ids {
                font: 600 10px/1.4 var(--mono);
                color: var(--cyan-dim);
                letter-spacing: 0.04em;
            }

            /* ---------- motion guard ---------- */
            @media (prefers-reduced-motion: reduce) {
                .tractor .sweep {
                    animation: none;
                    display: none;
                }
                * {
                    animation: none !important;
                }
            }
        </style>
    </head>
    <body>
        <!-- ============================================================================
       PALETTE · eval — floating dev control. Evaluation aid ONLY, not a
       production feature. The shipped game will NOT have an in-match palette
       toggle; this exists so we can pick the visual identity.
       ============================================================================ -->
        <div class="palette-bar" role="group" aria-label="Palette evaluation">
            <div class="pb-top">
                <span class="pb-label">PALETTE · eval</span>
                <span
                    class="pb-tag"
                    title="Evaluation aid only — not a production feature"
                    >DEV</span
                >
                <div class="pb-themes">
                    <button type="button" data-theme="vector" class="active">
                        Vector Standard
                    </button>
                    <button type="button" data-theme="cinder">
                        Cinder Siege
                    </button>
                    <button type="button" data-theme="phosphor">
                        Phosphor Terminal
                    </button>
                    <button type="button" data-theme="polybius">
                        Polybius Dusk
                    </button>
                    <button type="button" data-theme="clinical">
                        Clinical Trial
                    </button>
                    <button type="button" data-theme="arc" class="pb-arc">
                        Arc · Calm→Climax
                    </button>
                </div>
            </div>
            <div class="pb-arc-row" id="pbArcRow" hidden>
                <span class="pb-arc-label">CALM</span>
                <input
                    type="range"
                    min="0"
                    max="100"
                    value="30"
                    id="pbSlider"
                    class="pb-slider"
                    aria-label="Arc power: Vector Standard to Polybius Dusk"
                />
                <span class="pb-arc-label">CLIMAX</span>
                <span class="pb-arc-val" id="pbArcVal">30%</span>
            </div>
        </div>

        <div class="masthead">
            <h1>Meridian Run · Key HUD</h1>
            <div class="sub">
                1:1 play-screen mock — two states: standard &amp; focus/fade
                (Rosa W20 climax)
            </div>
            <div class="tag">16:9 · 1280×720 target</div>
        </div>

        <div class="windows">
            <!-- ============================================================
         STATE 1 — STANDARD
         ============================================================ -->
            <figure class="window">
                <div class="titlebar">
                    <span class="glyph"></span>
                    <span class="title"
                        ><b>Meridian Run</b> — play build 0.1.0 · compat
                        renderer</span

                    <span class="ctl"

                    <!-- enemy fire-columns -->

                        ><i class="bullet"></i><i class="bullet"></i>

                    <!-- enemies -->

                    </div>
                    <div class="enemy enemy-grunt" style="left: 31%; top: 19%">

                    <div class="bg-vign"></div>

                <figcaption>
                    <b>Standard state</b> — full HUD: lives (2/3 lit, sharp),

                    <!-- denser enemy fire-columns -->

                    <div class="firecol" style="left: 88%">

                        ><i class="bullet"></i><i class="bullet mag"></i
                        ><i class="bullet"></i><i class="bullet"></i
                        ><i class="bullet mag"></i>
                    </div>

                    <!-- enemies -->
                    <div class="enemy enemy-grunt" style="left: 12%; top: 20%">
                        <svg viewBox="0 0 20 20">
                            <path d="M10 2 L18 16 L10 12 L2 16 Z" />
                        </svg>
                    </div>
                    <div class="enemy enemy-grunt" style="left: 23%; top: 26%">
                        <svg viewBox="0 0 20 20">
                            <path d="M10 2 L18 16 L10 12 L2 16 Z" />
                        </svg>
                    </div>
                    <div class="enemy enemy-grunt" style="left: 36%; top: 18%">
                        <svg viewBox="0 0 20 20">
                            <path d="M10 2 L18 16 L10 12 L2 16 Z" />
                        </svg>
                    </div>
                    <div class="enemy enemy-grunt" style="left: 64%; top: 24%">
                        <svg viewBox="0 0 20 20">
                            <path d="M10 2 L18 16 L10 12 L2 16 Z" />
                        </svg>
                    </div>
                    <div class="enemy enemy-grunt" style="left: 88%; top: 20%">
                        <svg viewBox="0 0 20 20">
                            <path d="M10 2 L18 16 L10 12 L2 16 Z" />
                        </svg>
                    </div>

                    <!-- Shielder — damaged, pip down to 1 segment -->
                    <div

                    <!-- player (segmented HP bar stays sharp; 2/5 at climax) -->

                                <!-- A2: player projectiles = elongated chevrons
                                     with a bright outline — shape+outline-distinct
                                     from the enemy pellets (small amber dots) and
                                     the tractor (parallel bars). Player family. -->

                                    class="pshot"

                    <code>--climax-hazard</code> (hue+luminance-distinct from
                    climax magenta); player ship + player projectiles carry a
                    bright outline + arrowhead/chevron silhouette
                    shape-distinct from enemy pellets &amp; tractor bars — so
                    the player/hazard distinction survives the climax repaint
                    even in monochrome. Low-time timer halo is neutral white

        <!-- ============================================================================
     PALETTE SWITCHER — Evaluation aid ONLY, not a production feature.
     The shipped game will NOT expose an in-match palette toggle; this exists
     to choose the visual identity for Meridian Run. All five themes and the
     Arc (calm→climax) interpolation drive the same :root tokens, so the whole
     HUD re-skins live.
     ============================================================================ -->
        <script>
            (function () {
                "use strict";

                // 15 canonical tokens per theme, extracted from color-themes-1.html.
                var THEMES = {
                    vector: {
                        // Vector Standard — cold arcade cyan  (#00E5FF)
                        "--surface": "#060912",
                        "--surface-alt": "#0C1424",
                        "--text": "#E6F1FF",
                        "--muted": "#7E8DAA",
                        "--border": "#1E2A44",
                        "--primary": "#00E5FF",
                        "--primary-hover": "#5AF7FF",
                        "--health": "#4ADE80",
                        "--hazard": "#FF3D5A",
                        "--score": "#FFE066",
                        "--currency": "#C084FC",
                        "--modifier-swarm": "#FF3D5A",
                        "--modifier-gauntlet": "#00E5FF",
                        "--modifier-bounty": "#FFE066",
                        "--glow": "#5AF7FF",
                        "--climax-hazard": "#FF9E3D",
                        "--climax-muted": "#9979B0",
                    },
                    cinder: {
                        // Cinder Siege — warm ember siege  (#FF7A1A)
                        "--surface": "#0D0805",
                        "--surface-alt": "#1A0F08",
                        "--text": "#FFF4E6",
                        "--muted": "#8A6B5A",
                        "--border": "#3A2418",
                        "--primary": "#FF7A1A",
                        "--primary-hover": "#FFB347",
                        "--health": "#FFD166",
                        "--hazard": "#E63946",
                        "--score": "#FFE066",
                        "--currency": "#F4A261",
                        "--modifier-swarm": "#E63946",
                        "--modifier-gauntlet": "#FF9E3D",
                        "--modifier-bounty": "#FFD166",
                        "--glow": "#FF9E3D",
                    },
                    phosphor: {
                        // Phosphor Terminal — toxic green wireframe  (#39FF14)
                        "--surface": "#050A06",
                        "--surface-alt": "#0A1408",
                        "--text": "#C8FFD0",
                        "--muted": "#5A8A6B",
                        "--border": "#1A3A24",
                        "--primary": "#39FF14",
                        "--primary-hover": "#7FFF5A",
                        "--health": "#B8FF5A",
                        "--hazard": "#FF2D9B",
                        "--score": "#F2FF7A",
                        "--currency": "#00E5C7",
                        "--modifier-swarm": "#FF2D9B",
                        "--modifier-gauntlet": "#F2FF7A",
                        "--modifier-bounty": "#00E5C7",
                        "--glow": "#7FFF5A",
                    },
                    polybius: {
                        // Polybius Dusk — magenta synthwave dusk  (#FF2BD6)
                        "--surface": "#0F0820",
                        "--surface-alt": "#1A1030",
                        "--text": "#FDE6FF",
                        "--muted": "#9979B0",
                        "--border": "#2E1A4A",
                        "--primary": "#FF2BD6",
                        "--primary-hover": "#FF6BE8",
                        "--health": "#00F0C0",
                        "--hazard": "#FF3D5A",
                        "--score": "#FFE066",
                        "--currency": "#4FC3FF",
                        "--modifier-swarm": "#FF3D5A",
                        "--modifier-gauntlet": "#4FC3FF",
                        "--modifier-bounty": "#FFE066",
                        "--glow": "#FF6BE8",
                        "--climax-hazard": "#FF9E3D",
                        "--climax-muted": "#9979B0",
                    },
                    clinical: {
                        // Clinical Trial — sterile white-vector (LIGHT)  (#0047E6)
                        "--surface": "#E8ECF2",
                        "--surface-alt": "#FFFFFF",
                        "--text": "#0A0E14",
                        "--muted": "#5A6573",
                        "--border": "#C8D0DC",
                        "--primary": "#0047E6",
                        "--primary-hover": "#3D7BFF",
                        "--health": "#00A86B",
                        "--hazard": "#D90429",
                        "--score": "#0A0E14",
                        "--currency": "#6A4C93",
                        "--modifier-swarm": "#D90429",
                        "--modifier-gauntlet": "#0047E6",
                        "--modifier-bounty": "#6A4C93",
                        "--glow": "#3D7BFF",
                    },
                };

                var TOKEN_KEYS = Object.keys(THEMES.vector); // same 15 across all themes
                var ARC_FROM = THEMES.vector; // calm early-run
                var ARC_TO = THEMES.polybius; // godhood peak
                var root = document.documentElement;
                var slider = document.getElementById("pbSlider");
                var arcRow = document.getElementById("pbArcRow");
                var arcVal = document.getElementById("pbArcVal");
                var buttons = document.querySelectorAll(".pb-themes button");
                var mode = "vector"; // current selection (theme key or "arc")

                function hexToRgb(h) {
                    h = String(h).replace("#", "");
                    if (h.length === 3) {
                        h = h
                            .split("")
                            .map(function (c) {
                                return c + c;
                            })
                            .join("");
                    }
                    var n = parseInt(h, 16);
                    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
                }
                function rgbToHex(r, g, b) {
                    var f = function (x) {
                        var s = Math.round(x).toString(16);
                        return s.length < 2 ? "0" + s : s;
                    };
                    return "#" + f(r) + f(g) + f(b);
                }
                function lerpHex(a, b, t) {
                    var A = hexToRgb(a),
                        B = hexToRgb(b);
                    return rgbToHex(
                        A[0] + (B[0] - A[0]) * t,
                        A[1] + (B[1] - A[1]) * t,
                        A[2] + (B[2] - A[2]) * t,
                    );
                }

                function applyTheme(key) {
                    var t = THEMES[key];
                    for (var i = 0; i < TOKEN_KEYS.length; i++) {
                        root.style.setProperty(TOKEN_KEYS[i], t[TOKEN_KEYS[i]]);
                    }
                }
                function applyArc(pct) {
                    var t = pct / 100;
                    for (var i = 0; i < TOKEN_KEYS.length; i++) {
                        var k = TOKEN_KEYS[i];
                        root.style.setProperty(
                            k,
                            lerpHex(ARC_FROM[k], ARC_TO[k], t),
                        );
                    }
                }

                function setActiveButton(sel) {
                    buttons.forEach(function (b) {
                        b.classList.toggle(
                            "active",
                            b.getAttribute("data-theme") === sel,
                        );
                    });
                }

                function selectTheme(key) {
                    mode = key;
                    if (key === "arc") {
                        arcRow.hidden = false;
                        setActiveButton("arc");
                        applyArc(parseInt(slider.value, 10));
                        arcVal.textContent = slider.value + "%";
                    } else {
                        arcRow.hidden = true;
                        setActiveButton(key);
                        applyTheme(key);
                    }
                }

                buttons.forEach(function (b) {
                    b.addEventListener("click", function () {
                        selectTheme(b.getAttribute("data-theme"));
                    });
                });

                slider.addEventListener("input", function () {
                    arcVal.textContent = slider.value + "%";
                    if (mode === "arc") {
                        applyArc(parseInt(slider.value, 10));
                    }
                });

                // Default to Vector Standard on load (also the :root fallback if JS is off).
                selectTheme("vector");
            })();
        </script>
    </body>
</html>
